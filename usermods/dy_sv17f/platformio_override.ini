; Options
; -------
; WLED_USERMOD_DY_SV17F    - required: enables the usermod (compile-time on/off switch)
; DYSV17F_DEFAULT_TX_PIN   - optional: compile-time default UART TX pin
; DYSV17F_DEFAULT_RX_PIN   - optional: compile-time default UART RX pin
;
; Usage
; -----
; Copy this file to the WLED project root as platformio_override.ini
; (or merge the [env] sections into your existing platformio_override.ini)
; and build. Alternatively use usermods/platformio_override.usermods.ini.

; Build the usermod for a generic ESP32 board (all pins configurable at runtime)
[env:esp32dev_usermod_dy_sv17f]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods} dy_sv17f
build_flags = ${env:esp32dev.build_flags} -D WLED_USERMOD_DY_SV17F
board_build.partitions = ${esp32.extreme_partitions}

; Build the usermod for an ESP32-C3 board (UART1 pins software-remappable)
[env:esp32c3dev_usermod_dy_sv17f]
extends = env:esp32c3dev
board = esp32-c3-devkitm-1
custom_usermods = ${env:esp32c3dev.custom_usermods} dy_sv17f
build_flags = ${env:esp32c3dev.build_flags} -D WLED_USERMOD_DY_SV17F
board_build.partitions = ${esp32.extreme_partitions}

; Build the usermod for an ESP8266 board (uses SoftwareSerial)
[env:nodemcuv2_usermod_dy_sv17f]
extends = env:nodemcuv2
custom_usermods = dy_sv17f
build_flags = ${common.build_flags} ${esp8266.build_flags} -D WLED_RELEASE_NAME=\"ESP8266\" -D WLED_DISABLE_PARTICLESYSTEM2D -D WLED_USERMOD_DY_SV17F